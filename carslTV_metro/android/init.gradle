// Gradle init script to disable problematic React Native autolinking tasks
allprojects {
    afterEvaluate { project ->
        if (project.name == 'app') {
            def tasksToDisable = [
                'generateAutolinkingPackageList',
                'generateAutolinkingNewArchitectureFiles', 
                'generateCodegenSchemaFromJavaScript',
                'generateCodegenArtifactsFromSchema',
                'generateReactNativeEntryPoint'
            ]
            
            tasksToDisable.each { taskName ->
                def task = project.tasks.findByName(taskName)
                if (task) {
                    task.enabled = false
                    println "Disabled $taskName task"
                }
            }
        }
    }
}

// Also try to disable via the gradle.projectsEvaluated callback
gradle.projectsEvaluated {
    def appProject = project(':app')
    if (appProject) {
        def tasksToDisable = [
            'generateAutolinkingPackageList',
            'generateAutolinkingNewArchitectureFiles',
            'generateCodegenSchemaFromJavaScript', 
            'generateCodegenArtifactsFromSchema',
            'generateReactNativeEntryPoint'
        ]
        
        tasksToDisable.each { taskName ->
            def task = appProject.tasks.findByName(taskName)
            if (task && task.enabled) {
                task.enabled = false
                println "Disabled $taskName task (from projectsEvaluated)"
            }
        }
    }
}

